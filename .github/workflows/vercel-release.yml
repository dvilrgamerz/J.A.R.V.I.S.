name: Deploy Vercel Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release label for the Vercel deployment
        required: false
        default: J.A.R.V.I.S. release

permissions:
  contents: write

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create release deployment commit
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "[deploy] ${RELEASE_NAME:-J.A.R.V.I.S. release}"
          git push origin HEAD:main
